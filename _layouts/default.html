<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>{{ site.title }}</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:500,700&display=swap" rel="stylesheet">
  <style>
    /* 重置 & 全局样式 (保留原风格) */
    html, body { margin:0; padding:0; background:#f8fafc; color:#243047; min-height:100vh; }
    body { font-family: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }

    /* 新的顶部导航容器 —— 替代原来的sidebar */
    .top-bar {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 32px 16px 32px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e6ea;
    }

    /* 左侧：头像 + 昵称 + 描述（紧凑组） */
    .top-info {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }
    .top-avatar {
      width: 64px;
      height: 64px;
      border-radius: 24px;
      border: 3px solid #2563eb33;
      background: #fff;
    }
    .top-text {
      display: flex;
      flex-direction: column;
    }
    .top-nickname {
      font-weight: 700;
      font-size: 1.35rem;
      color: #18408e;
      margin-bottom: 4px;
    }
    .top-desc {
      color: #394769;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .top-desc br {
      display: none;  /* 原desc中的<br>在横向布局里会换行，保留但视觉内显示为空格？原desc中有“Web 安全 → AI Agent 安全<br>主攻...” */
    }
    /* 为了让原<br>正常换行，还原显示 */
    .top-desc br {
      display: inline;
    }

    /* 右侧导航 + contact */
    .top-nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .top-nav-links nav a {
      display: inline-block;
      padding: 6px 8px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      margin-right: 12px;
    }
    .top-nav-links nav a:hover {
      background: #b7d9ff22;
    }
    .contact {
      /* 原contact为空，保留但仅占位 */
    }
    .contact a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }

    /* 主内容区：占据剩余宽度，居中留白 */
    .main {
      max-width: 800px;
      margin: 2rem auto 0;
      background: #fff;
      padding: 32px 40px 50px 40px;
      border-radius: 24px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.02);
    }

    /* 原footer样式保留 */
    .footer {
      color: #a9aab2;
      font-size: .99em;
      margin-top: 44px;
      text-align: right;
      padding-right: 5px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    /* 响应式：窄屏时顶部信息堆叠 */
    @media (max-width: 780px) {
      .top-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      .top-nav-links {
        align-self: flex-start;
        margin-top: 4px;
      }
      .main {
        padding: 24px 28px;
        margin: 1.5rem 20px;
      }
      .footer {
        margin: 0 20px 20px 20px;
        text-align: left;
      }
    }
    @media (max-width: 550px) {
      .top-info {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .main {
        padding: 20px 20px;
      }
    }
  </style>
</head>
<body>
  <!-- 原侧边栏的内容全部迁移到顶部 -->
  <div class="top-bar">
    <div class="top-info">
      <img class="top-avatar avatar" src="https://avatars.githubusercontent.com/u/117813634?s=400&u=6d68b7d649e6422fa6cc985b15726c4fd1434a15&v=4" alt="jnnysec">
      <div class="top-text">
        <div class="top-nickname nickname">{{ site.author }}</div>
        <div class="top-desc desc">Web 安全 → AI Agent 安全<br>主攻 Prompt Injection、Jailbreak、Agent 框架审计</div>
      </div>
    </div>
    <div class="top-nav-links">
      <nav>
        <a href="{{ '/' | relative_url }}">主页</a>
        <a href="https://github.com/jnnysec" target="_blank">GitHub</a>
      </nav>
      <div class="contact">
        <!-- 原contact保留为空，不做任何增减 -->
      </div>
    </div>
  </div>

  <!-- 原来的主内容区，完全不变 -->
  <main class="main">
    {{ content }}
    <div class="footer">
      jnnysec.github.io · 个人学习记录
    </div>
  </main>
</body>
</html>
